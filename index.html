<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15130f">
  <title>Nizam Cafe | Menü</title>
  <style>
    :root{--ink:#17140f;--espresso:#42230f;--paper:#f8f1e5;--paper-2:#fffaf1;--line:#d9cdbd;--muted:#776f65;--bronze:#9b6a37;--shadow:0 20px 60px rgba(65,45,24,.18);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#211d18;background:#e7ddcf}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#fffaf0 0,#e9dfd1 56%,#d8cbb9 100%);font-size:16px;line-height:1.45}button{font:inherit;cursor:pointer}.phone{width:min(440px,100%);min-height:100vh;margin:auto;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;position:relative}.screen{display:none;min-height:100vh}.screen.active{display:block}.home-hero{height:405px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:32px 24px;color:#fff;text-align:center;background:linear-gradient(0deg,rgba(16,11,7,.92),rgba(16,11,7,.07) 72%),url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=85') center/cover}.lang{position:absolute;right:17px;top:17px;font-size:.75rem;font-weight:800;letter-spacing:.08em}.logo{width:108px;height:108px;border:1.5px solid rgba(255,255,255,.95);border-radius:50%;display:grid;place-items:center;margin-bottom:17px;background:rgba(16,12,8,.3);backdrop-filter:blur(5px);box-shadow:0 8px 30px rgba(0,0,0,.25)}.logo-main{font:600 1.45rem/1 Georgia,serif;letter-spacing:.13em}.logo-sub{display:block;font:600 .52rem/1.2 Inter,sans-serif;letter-spacing:.26em;margin-top:7px}.home-hero h1{font:600 2.4rem/1 Georgia,serif;letter-spacing:.09em;margin:0}.welcome{font:italic 1.6rem/1.3 Georgia,serif;margin:6px 0 4px}.home-hero p{font-size:.87rem;color:#ece5dc;margin:0}.home-body{position:relative;margin-top:-16px;padding:19px 15px 30px;background:linear-gradient(165deg,var(--paper-2),#f4ecdf);border-radius:22px 22px 0 0;min-height:calc(100vh - 389px)}.home-body:before,.category-content:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(circle at 20% 20%,#6e8462 0 2px,transparent 3px),radial-gradient(circle at 75% 65%,#6e8462 0 1.5px,transparent 3px);background-size:95px 95px}.category-grid{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.category-card{min-height:112px;border:1px solid #dacdbb;border-radius:16px;background:rgba(255,252,246,.72);color:var(--ink);display:grid;place-items:center;align-content:center;padding:13px 8px;transition:.2s ease;box-shadow:0 6px 16px rgba(62,42,18,.04)}.category-card:hover{transform:translateY(-2px);border-color:#aa8b64;box-shadow:0 10px 20px rgba(62,42,18,.09)}.category-card:active{transform:scale(.97)}.line-icon{font-size:2rem;filter:grayscale(1) sepia(.35);margin-bottom:7px}.category-card strong{font:600 .94rem Georgia,serif}.motto{position:relative;text-align:center;margin:24px 0 2px;color:#5d5145;font:600 .64rem Georgia,serif;letter-spacing:.28em}.topbar{height:62px;background:var(--ink);color:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;position:sticky;top:0;z-index:10}.back{height:100%;border:0;background:none;color:#fff;font-size:2rem;font-weight:200}.topbar h2{text-align:center;font:600 1.25rem Georgia,serif;margin:0}.brand-dot{text-align:center;font:700 .57rem Georgia,serif;letter-spacing:.08em;color:#ddc9a8}.category-hero{height:195px;display:flex;align-items:flex-end;padding:22px;background-position:center;background-size:cover;color:#fff;position:relative}.category-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,11,5,.78),rgba(18,11,5,.06))}.category-hero p{position:relative;z-index:1;margin:0;max-width:230px;font:italic 1.34rem/1.28 Georgia,serif;text-shadow:0 2px 12px #000}.category-content{position:relative;margin-top:-12px;border-radius:18px 18px 0 0;background:var(--paper-2);padding:14px 13px 30px;min-height:calc(100vh - 245px)}.filters{position:relative;display:flex;gap:7px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #d9cdbd;background:#faf4ea;border-radius:999px;padding:8px 15px;color:#5c544b;font-size:.72rem}.filter.active{background:var(--espresso);border-color:var(--espresso);color:#fff}.products{position:relative}.product{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid #e4d9ca;animation:rise .28s ease both}.product img{width:68px;height:68px;border-radius:12px;object-fit:cover;box-shadow:0 5px 12px rgba(52,34,14,.15)}.product h3{font:600 .95rem Georgia,serif;margin:0 0 3px;color:#251e17}.product p{margin:0;color:var(--muted);font-size:.68rem;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{display:flex;align-items:center;font-size:.76rem;font-weight:850;white-space:nowrap}.price:before{content:"";width:20px;margin-right:7px;border-bottom:1px dotted #aa9d8c}.popular{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:99px;background:#f3dfbc;color:#8b571c;font:700 .52rem Inter,sans-serif}.footer{position:relative;text-align:center;padding:24px 10px 8px;color:#796f63;font:600 .58rem Georgia,serif;letter-spacing:.22em}.empty{padding:48px 12px;text-align:center;color:var(--muted)}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.product:nth-child(2){animation-delay:.03s}.product:nth-child(3){animation-delay:.06s}.product:nth-child(4){animation-delay:.09s}.product:nth-child(5){animation-delay:.12s}@media(min-width:700px){body{padding:24px}.phone{border-radius:30px;min-height:calc(100vh - 48px)}.screen{min-height:calc(100vh - 48px)}}
    .logo{padding:7px;background:rgba(248,241,229,.94);border:2px solid #fff;color:var(--ink)}.logo-ring{width:100%;height:100%;border:1.5px solid var(--ink);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 3px rgba(23,20,15,.06)}.logo-main{font-size:.78rem;letter-spacing:.24em;margin-left:.24em}.logo-cup{font-size:1.7rem;line-height:1.25;filter:grayscale(1)}.logo-sub{font-size:.48rem;letter-spacing:.38em;margin:0 0 0 .38em}.filter{transition:background .18s,color .18s,transform .18s}.filter:active{transform:scale(.95)}
  .lang{z-index:3;cursor:pointer;background:#fffaf0;color:#2c2016;border:1px solid #e1d2bd;border-radius:8px;padding:8px;font-size:13px}
  .product.no-image{grid-template-columns:minmax(0,1fr) auto}
  </style>
</head>
<body>
  <main class="phone">
    <section class="screen active" id="homeScreen">
      <div class="home-hero">
        <select class="lang" id="languageSelect" aria-label="Dil seçimi"><option value="tr">TR</option><option value="en">EN</option></select>
        <div class="logo" aria-label="Nizam Cafe logosu"><div class="logo-ring"><span class="logo-main">NİZAM</span><span class="logo-cup">☕</span><span class="logo-sub">CAFE</span></div></div>
        <h1>NİZAM CAFE</h1><div class="welcome" id="welcomeText">Hoş geldiniz</div><p id="heroSubtitle">Güzel kahveler, daha güzel sohbetler…</p>
      </div>
      <div class="home-body"><div class="category-grid" id="categoryGrid"></div><div class="motto" id="mottoText">KAHVE HER ZAMAN İYİ BİR FİKİRDİR</div></div>
    </section>
    <section class="screen" id="categoryScreen">
      <header class="topbar"><button class="back" id="backButton" aria-label="Ana menüye dön">‹</button><h2 id="categoryTitle"></h2><span class="brand-dot">NİZAM</span></header>
      <div class="category-hero" id="categoryHero"><p id="categoryQuote"></p></div>
      <div class="category-content"><div class="filters" id="filters"></div><div class="products" id="productList"></div><footer class="footer" id="footerText">NİZAM CAFE · AFİYET OLSUN</footer></div>
    </section>
  </main>
  <script>
    let menu = { categories: [], products: [] };
    const grid=document.getElementById('categoryGrid'),home=document.getElementById('homeScreen'),category=document.getElementById('categoryScreen'),title=document.getElementById('categoryTitle'),hero=document.getElementById('categoryHero'),quote=document.getElementById('categoryQuote'),filters=document.getElementById('filters'),list=document.getElementById('productList');let activeCategory=null,activeImage='';
    const safe=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    let lang = localStorage.getItem('nizam_language') === 'en' ? 'en' : 'tr';
    const enFilters = {'Tümü':'All','Sütlü':'With milk','Filtre':'Filter','Kahve':'Coffee','Siyah Çay':'Black tea','Bitki Çayı':'Herbal tea','Pasta':'Cake','Kruvasan':'Croissant','Gazlı':'Soda','Meyve Suyu':'Fruit juice','Tost':'Toast','Sıcak':'Hot'};
    const enCategories = {coffee:'Coffees',cold:'Iced Coffees',tea:'Teas',dessert:'Desserts',drink:'Drinks',snack:'Snacks'};
    const englishProducts = {'Espresso':['Espresso','Small but strong, rich and aromatic.'],'Americano':['Americano','Espresso with hot water.'],'Latte':['Latte','Espresso with steamed milk and light foam.'],'Cappuccino':['Cappuccino','Espresso with steamed milk and thick foam.'],'Macchiato':['Macchiato','Espresso topped with a little milk foam.'],'Mocha':['Mocha','Espresso, chocolate, milk and cream.'],'Filtre Kahve':['Filter Coffee','Smooth freshly brewed coffee.'],'Ice Americano':['Iced Americano','Espresso, cold water and ice.'],'Ice Latte':['Iced Latte','Espresso, cold milk and ice.'],'Ice Mocha':['Iced Mocha','Chocolate, espresso, milk and ice.'],'Frappe':['Frappe','Coffee, milk and frappe mix.'],'Milkshake':['Milkshake','Strawberry, chocolate or vanilla.'],'Siyah Çay':['Black Tea','Freshly brewed classic tea.'],'Bitki Çayı':['Herbal Tea','Herbal tea of the day.'],'Yeşil Çay':['Green Tea','Light and refreshing.'],'Ihlamur':['Linden Tea','Warm herbal infusion.'],'Kruvasan Sandviç':['Croissant Sandwich','Fresh croissant with a special filling.'],'Kruvasan Sade':['Plain Croissant','Buttery, flaky croissant.'],'Kruvasan Çikolatalı':['Chocolate Croissant','Fresh croissant filled with chocolate.'],'Sütlü Kadayıf':['Milk Kadayıf','Light traditional milk dessert.'],'Sütlaç':['Rice Pudding','Classic baked rice pudding.'],'Cheesecake':['Cheesecake','Cheesecake of the day.'],'Kola':['Cola','330 ml canned drink.'],'Fanta':['Fanta','330 ml canned drink.'],'Limonata':['Lemonade','Homemade with fresh lemons.'],'Portakal Suyu':['Orange Juice','Freshly squeezed orange juice.'],'Soda':['Mineral Water','Bottled mineral water.'],'Karışık Tost':['Mixed Toast','Turkish sausage, cheese and tomato.'],'Kaşarlı Tost':['Cheese Toast','Hot toast with plenty of cheese.'],'Patates Kızartması':['French Fries','Crispy fries with special sauce.'],'Soğan Halkası':['Onion Rings','Crispy battered onion rings.'],'Çıtır Tavuk':['Crispy Chicken','Spiced crispy chicken pieces.']};
    function localizedCategory(c){return lang==='en'?(c.name_en||enCategories[c.id]||c.name):c.name}
    function localizedQuote(c){return lang==='en'?(c.quote_en||'Enjoy a delicious break at Nizam Cafe.'):c.quote}
    function localizedProduct(p){return lang==='en'?[p[6]||englishProducts[p[1]]?.[0]||p[1],p[7]||englishProducts[p[1]]?.[1]||p[2]]:[p[1],p[2]]}
    function applyLanguage(){
      document.documentElement.lang=lang;
      document.getElementById('languageSelect').value=lang;
      document.getElementById('welcomeText').textContent=lang==='en'?'Welcome':'Hoş geldiniz';
      document.getElementById('heroSubtitle').textContent=lang==='en'?'Great coffee, even better conversations…':'Güzel kahveler, daha güzel sohbetler…';
      document.getElementById('mottoText').textContent=lang==='en'?'COFFEE IS ALWAYS A GOOD IDEA':'KAHVE HER ZAMAN İYİ BİR FİKİRDİR';
      document.getElementById('footerText').textContent=lang==='en'?'NIZAM CAFE · ENJOY':'NİZAM CAFE · AFİYET OLSUN';
      initializeMenu();if(activeCategory)openCategory(activeCategory);
    }
    document.getElementById('languageSelect').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('nizam_language',lang);applyLanguage()});
    function initializeMenu(){grid.innerHTML=menu.categories.map(c=>`<button class="category-card" data-id="${safe(c.id)}"><span class="line-icon">${safe(c.icon)}</span><strong>${safe(localizedCategory(c))}</strong></button>`).join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>openCategory(b.dataset.id));}
    function openCategory(id){const c=menu.categories.find(x=>x.id===id);if(!c)return;activeCategory=id;activeImage=c.image||'';title.textContent=localizedCategory(c);quote.textContent=localizedQuote(c);hero.style.backgroundImage=c.image?`linear-gradient(90deg,rgba(18,11,5,.78),rgba(18,11,5,.06)),url('${encodeURI(c.image).replace(/'/g,'%27')}')`:'linear-gradient(90deg,#42230f,#9b6a37)';filters.innerHTML=(c.filters||['Tümü']).map((f,i)=>`<button class="filter ${i===0?'active':''}" data-filter="${safe(f)}">${safe(lang==='en'?(enFilters[f]||f):f)}</button>`).join('');filters.querySelectorAll('button').forEach(button=>button.onclick=()=>{filters.querySelectorAll('button').forEach(x=>x.classList.remove('active'));button.classList.add('active');renderProducts(activeCategory,button.dataset.filter)});renderProducts(id,'Tümü');home.classList.remove('active');category.classList.add('active');scrollTo(0,0)}
    function matchesFilter(product,filter){if(filter==='Tümü')return true;const text=(product[1]+' '+product[2]).toLocaleLowerCase('tr-TR');const rules={Espresso:['espresso','americano','macchiato'],Sütlü:['latte','cappuccino','mocha'],Filtre:['filtre'],Kahve:['americano','latte','coffee','mocha','frappe'],Milkshake:['milkshake'],'Siyah Çay':['siyah çay'],'Bitki Çayı':['bitki','yeşil','ıhlamur'],Pasta:['cheesecake'],Kruvasan:['kruvasan'],Gazlı:['kola','fanta','soda'],'Meyve Suyu':['limonata','portakal'],Tost:['tost'],Sıcak:['patates','soğan','tavuk']};return(rules[filter]||[filter.toLocaleLowerCase('tr-TR')]).some(word=>text.includes(word.toLocaleLowerCase('tr-TR')))}
    function renderProducts(id,filter='Tümü'){const items=menu.products.filter(p=>p[0]===id&&matchesFilter(p,filter));list.innerHTML=items.length?items.map(p=>{const [name,desc]=localizedProduct(p);const image=p[5]||'';return `<article class="product ${image?'':'no-image'}">${image?`<img src="${safe(image)}" alt="${safe(name)}" loading="lazy">`:''}<div><h3>${safe(name)}${p[4]?`<span class="popular">${safe(lang==='en'&&p[4]==='Popüler'?'Popular':p[4])}</span>`:''}</h3><p>${safe(desc)}</p></div><div class="price">${safe(p[3])}</div></article>`}).join(''):`<div class="empty">${lang==='en'?'No products in this filter.':'Bu filtrede ürün bulunamadı.'}</div>`}
    document.getElementById('backButton').onclick=()=>{category.classList.remove('active');home.classList.add('active');scrollTo(0,0)};
    async function loadMenu(){
      grid.innerHTML = '<div class="empty">Menü yükleniyor…</div>';
      try {
        const response = await fetch('./menu.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        if (!data || !Array.isArray(data.categories) || !Array.isArray(data.products)) {
          throw new Error('Geçersiz menü verisi');
        }
        menu = data;
        applyLanguage();
      } catch (error) {
        console.error('Menü yüklenemedi:', error);
        grid.innerHTML = '<div class="empty">Menü şu anda yüklenemiyor. Lütfen sayfayı yenileyip tekrar deneyin.</div>';
      }
    }
    loadMenu();
  </script>
</body>
</html>
